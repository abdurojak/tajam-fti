[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify detects Next.js and installs its OpenNext adapter automatically.
# Secrets must be set in Netlify's environment settings, with Functions scope.
# Do not add an SPA redirect: the app needs Next.js API and OAuth routes.
